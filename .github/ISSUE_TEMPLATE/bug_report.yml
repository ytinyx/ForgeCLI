name: Bug report
description: Report a reproducible problem in ForgeCLI.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Please remove API keys, access tokens and private source code from your report.
        For security vulnerabilities, contact the maintainer as described in SECURITY.md.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Python version, ForgeCLI version and terminal or browser.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest example that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Relevant output
      description: Include only the necessary, redacted output.
      render: text
