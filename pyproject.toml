[project]
name = "forgecli"
version = "1.0.0"
description = "An AI coding workbench for the terminal"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["ai", "cli", "coding-assistant", "terminal"]
maintainers = [{name = "ytinyx", email = "ytiny163@163.com"}]
dependencies = [
    "textual>=2.1.0",
    "anthropic>=0.47.0",
    "openai>=1.60.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "mcp>=1.30.0,<2",
    "httpx>=0.27.0",
    "websockets>=14.0",
]

[project.scripts]
forgecli = "forgecli.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["forgecli"]

[tool.hatch.build.targets.sdist]
only-include = [
    "forgecli", "tests", "scripts", ".github",
    ".forgecli/config.yaml.example", ".gitignore", ".gitattributes",
    "pyproject.toml", "uv.lock", "README.md", "CHANGELOG.md", "FORGECLI.md",
    "CONTRIBUTING.md", "SECURITY.md", "LICENSE", "THIRD_PARTY_NOTICES.md",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-timeout>=2.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
asyncio_default_fixture_loop_scope = "function"
timeout = 120
